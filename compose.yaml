# Docker Compose / Podman Compose for Krazy Kontainer.
# Default: pull published GHCR image. For a local build, uncomment `build: .`
# Podman: prefer rootless; use :Z on volumes for SELinux (Fedora/RHEL).
services:
  krazytogo:
    # build: .
    image: ghcr.io/crimsonflower420/krazytogo:latest
    ports:
      - "8080:8080"
    environment:
      KRAZY_ROOT: /data
      KRAZY_ADDR: ":8080"
      KRAZY_BROWSE: "true"
    volumes:
      # :Z is ignored by Docker on non-SELinux hosts; required for rootless Podman+SELinux.
      - ./data:/data:Z
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
